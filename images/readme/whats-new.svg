<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="What's new in Vetro 3.4.5: secret folder, faster search, redesigned settings panels, favorites strip">
  <defs>
    <radialGradient id="glowO" cx="0.12" cy="0.05" r="0.7"><stop offset="0" stop-color="#E85002" stop-opacity="0.34"/><stop offset="1" stop-color="#E85002" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowG" cx="0.98" cy="1" r="0.55"><stop offset="0" stop-color="#34C759" stop-opacity="0.16"/><stop offset="1" stop-color="#34C759" stop-opacity="0"/></radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#58C8FF" stop-opacity="0.35"/><stop offset="1" stop-color="#58C8FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="fadeMask" cx="0.5" cy="0.5" r="0.5"><stop offset="0.62" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="soft" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#fadeMask)"/></mask>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FFB27F"/></linearGradient>
    <clipPath id="card"><rect width="880" height="300" rx="28"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 3px; fill: #F16001; }
    .title { font-size: 58px; font-weight: 800; letter-spacing: -1.5px; fill: url(#title); }
    .sub { font-size: 17px; fill: #B9BCC4; }
    .chip { font-size: 14px; font-weight: 600; fill: #ECECEF; }
    .float { animation: bob 4.2s ease-in-out infinite; transform-box: fill-box; }
    .pulse { animation: pulse 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(.82); opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .float, .pulse { animation: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="#0A0A0B"/>
    <rect width="880" height="300" fill="url(#glowO)"/>
    <rect width="880" height="300" fill="url(#glowG)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="299" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="48" y="64" class="eyebrow">WHAT'S NEW</text>
  <text x="46" y="128" class="title">Vetro 3.4.5</text>
  <text x="48" y="168" class="sub">A secret folder behind your fingerprint, and a faster search.</text>
  <text x="48" y="194" class="sub">Redesigned account, AI Connect and enrichment panels.</text>
  <g><rect x="48" y="226" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/><circle cx="64" cy="243" r="3.5" fill="#E85002"/><text x="76" y="248" class="chip">Secret folder</text></g>
  <g><rect x="190" y="226" width="148" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/><circle cx="206" cy="243" r="3.5" fill="#E85002"/><text x="218" y="248" class="chip">Faster search</text></g>
  <g><rect x="348" y="226" width="140" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/><circle cx="364" cy="243" r="3.5" fill="#E85002"/><text x="376" y="248" class="chip">New settings</text></g>
  <g><rect x="498" y="226" width="157" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/><circle cx="514" cy="243" r="3.5" fill="#E85002"/><text x="526" y="248" class="chip">Favorites strip</text></g>
  
  <ellipse class="pulse" cx="712" cy="268" rx="104" ry="14" fill="url(#floor)"/>
  <g class="float"><image x="582" y="26" width="260" height="260" mask="url(#soft)" xlink:href="data:image/webp;base64," href="data:image/webp;base64,"/></g>
</svg>
