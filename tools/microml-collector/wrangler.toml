name = "vetro-microml-collector"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = false

[[routes]]
pattern = "contrib.vetrostudio.bid"
custom_domain = true

# The owner's bucket. Create once:  npx wrangler r2 bucket create vetro-contrib
# Folders inside: microml/<day>/<install>.json (training numbers) and sources/<day>/<id>.json (book records from other sites).
[[r2_buckets]]
binding = "CONTRIB"
bucket_name = "vetro-contrib"

# Per-client throttle. The binding only counts; no address is kept.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 30
  period = 60

# Do not enable logs that record request metadata: the privacy promise is that no IP is kept.
[observability]
enabled = false
